name: E2E Test Coverage
on: 
  push:
    branches:
      - "main"
      - "release-*"
    paths-ignore:
      - "**.md"
      - "channel.yaml"
      - "install.sh"
      - "tests/**"
      - "!tests/e2e**"
      - "!tests/docker**"
      - "!tests/client.go"
      - ".github/**"
      - "!.github/actions/**"
      - "!.github/workflows/e2e.yaml"
      - "!.github/workflows/build-k3s.yaml"
  pull_request:
    paths-ignore:
      - "**.md"
      - "channel.yaml"
      - "install.sh"
      - "tests/**"
      - "!tests/e2e**"
      - "!tests/docker**"
      - "!tests/client.go"
      - ".github/**"
      - "!.github/actions/**"
      - "!.github/workflows/e2e.yaml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-k3s.yaml
    with:
      upload-image: true
      test-coverage: true
  docker-go:
    needs: [build]
    name: Docker
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        dtest: [snapshotrestore]
        arch: [amd64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
    - name: Remove Unnecessary Tools
      working-directory: /
      run: |
        sudo rm -rf \
          /home/linuxbrew \
          /home/packer \
          /opt/az \
          /opt/microsoft \
          /usr/lib/firefox \
          /usr/lib/google-cloud-sdk \
          /usr/local/julia* \
          /usr/local/share/boost \
          /usr/local/share/chromium \
          /usr/local/share/powershell \
          /usr/share/az* \
          /usr/share/dotnet \
          /usr/share/miniconda \
          /usr/share/swift
        df -khl
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Install Go
      uses: ./.github/actions/setup-go
    - name: "Download K3s image"
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: k3s-${{ matrix.arch }}
        path: ./dist/artifacts
    - name: Set up Docker
      uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0
      with:
        version: type=image,tag=29
        daemon-config: '{"features":{"containerd-snapshotter":true}}'
        set-host: true
    - name: Load and set K3s image
      run: |
        if [ ${{ matrix.arch }} = "arm64" ]; then
          mv ./dist/artifacts/k3s-arm64 ./dist/artifacts/k3s
        fi
        chmod +x ./dist/artifacts/k3s
        docker image load -i ./dist/artifacts/k3s-image.tar
        IMAGE_TAG=$(docker image ls --format '{{.Repository}}:{{.Tag}}' | grep 'rancher/k3s')
        echo "K3S_IMAGE=$IMAGE_TAG" >> $GITHUB_ENV
    - name: Install Nix
      if: matrix.dtest == 'nixsnapshotter'
      uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      with:
        summarize: false
    - name: Build nix test image
      if: matrix.dtest == 'nixsnapshotter'
      run: |
        nix build github:pdtpartners/nix-snapshotter#image-hello
        cp result ./tests/docker/resources/nix-hello-image.tar
    - name: Determine channel
      run: |
        echo CHANNEL=$(. ./scripts/version.sh; echo $VERSION_K8S | cut -d'.' -f1,2) >> $GITHUB_ENV
    - name: Run ${{ matrix.dtest }} Test
      run: |
        go install github.com/onsi/ginkgo/v2/ginkgo@$(. ./scripts/version.sh; get-module-version github.com/onsi/ginkgo/v2)
        # These tests use ghcr.io/rancher/systemd-node and have different flags.
        CI_TESTS="autoimport dualstack hardened secretsencryption svcpoliciesandfirewall token"
        if [ ${{ matrix.dtest }} = "upgrade" ] || [ ${{ matrix.dtest }} = "skew" ]; then
          ginkgo run -v -timeout=0 ./tests/docker/${{ matrix.dtest }}/ -- -k3sImage=$K3S_IMAGE -channel=$CHANNEL
        elif [ ${{ matrix.dtest }} = "snapshotrestore" ]; then
          ginkgo run -v --procs=4 -timeout=0 ./tests/docker/${{ matrix.dtest }}/ -- -ci
        elif [[ $CI_TESTS =~ ${{ matrix.dtest }} ]]; then
          ginkgo run -v -timeout=0 ./tests/docker/${{ matrix.dtest }}/ -- -ci
        else
          ginkgo run -v -timeout=0 ./tests/docker/${{ matrix.dtest }}/ -- -k3sImage=$K3S_IMAGE
        fi

